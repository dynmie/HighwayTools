# Builds on every push/PR to master. On push to master it also publishes an
# auto prerelease tagged v<mod_version>-pre.<N>, where N counts existing
# v<mod_version>-pre.* tags (0.2.0 -> pre.1, pre.2, ...; bumping mod_version
# to 0.2.1 resets the counter to pre.1). PRs only build + upload an artifact.

name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Compute prerelease version
      id: version
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        BASE=$(sed -n 's/^mod_version=//p' gradle.properties)
        ESC=${BASE//./[.]}
        COUNT=$(gh api "repos/${{ github.repository }}/tags" --paginate --jq '.[].name' | grep -cE "^v${ESC}-pre[.][0-9]+$" || true)
        echo "version=${BASE}-pre.$((COUNT + 1))" >> "$GITHUB_OUTPUT"

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build with Gradle
      run: ./gradlew build -Pmod_version=${{ steps.version.outputs.version || '0.2.0' }}

    - name: Upload JAR as artifact
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: highway-${{ steps.version.outputs.version }}
        path: build/libs/*.jar
        if-no-files-found: error

    - name: Publish prerelease
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: v${{ steps.version.outputs.version }}
        body: |
          Automated prerelease from commit `${{ github.sha }}`
        files: build/libs/*.jar
        generate_release_notes: true
        prerelease: true
        target_commitish: ${{ github.sha }}

  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v4
