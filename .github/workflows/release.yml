# Manual release: click "Run workflow", type a version (e.g. 0.2.0-pre.1 or 0.2.0),
# and this builds exactly that version and publishes a GitHub release.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0-pre.1 (tag becomes v0.2.0-pre.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build with Gradle
      run: ./gradlew build -Pmod_version=${{ inputs.version }}

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ inputs.version }}
        name: v${{ inputs.version }}
        body: |
          Automated build from commit `${{ github.sha }}`
        files: build/libs/*.jar
        generate_release_notes: true
        prerelease: ${{ contains(inputs.version, '-pre') }}
